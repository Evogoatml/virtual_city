<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual City — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "tween": "https://unpkg.com/@tweenjs/tween.js@18.6.0/dist/tween.umd.js"
  }
}
</script>
<style>
  :root {
    --bg: #070b12;
    --panel: rgba(10, 16, 26, 0.92);
    --border: #1a2a3a;
    --text: #c8d6e5;
    --dim: #6b7d92;
    --accent: #4488ff;
    /* dashboard palette (used by dashboard.js renderers) */
    --bg-card: rgba(16, 24, 38, 0.85);
    --radius-sm: 8px;
    --text-muted: #6b7d92;
    --text-secondary: #a9c0d8;
    --accent-green: #4caf50;
    --accent-red: #e53935;
    --accent-gold: #ffb300;
    --accent-cyan: #00bcd4;
    --accent-purple: #9c27b0;
    --glow-gold: rgba(255, 179, 0, 0.35);
    --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }

  #canvas-container { position: absolute; inset: 0; top: 0; }
  #canvas-container canvas { display: block; }

  /* ===== Header ===== */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20; height: 50px;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: linear-gradient(180deg, rgba(7,11,18,0.9), rgba(7,11,18,0.0));
    pointer-events: none;
  }
  header h1 { font-size: 16px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; color: #e6eefc; }
  header nav { display: flex; gap: 14px; }
  header nav a { pointer-events: auto; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  #connection-indicator { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  #connection-indicator.connected { color: #6fd96f; }
  #connection-indicator.disconnected { color: #ff8080; }

  /* ===== Loading ===== */
  #loading-screen {
    position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: var(--bg); color: var(--dim); font-size: 13px;
    transition: opacity 0.6s; pointer-events: none;
  }
  #loading-screen.done { opacity: 0; }
  #trigger-meeting {
    pointer-events: auto; font-size: 11px; padding: 4px 10px; background: #1a3a5a; color: #c8e1ff;
    border: 1px solid var(--border); border-radius: 4px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 0.5px; margin-left: 8px;
  }
  #trigger-meeting:hover { background: #24496e; }

  /* ===== City HUD (top-left, always minimal) ===== */
  #hud {
    position: absolute; z-index: 15; top: 54px; left: 16px;
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 55vw;
  }
  .hud-chip {
    display: flex; align-items: baseline; gap: 6px; padding: 6px 11px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    backdrop-filter: blur(6px);
  }
  .hud-chip .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--dim); }
  .hud-chip .v { font-size: 15px; font-weight: 800; }
  .hud-chip .v.money { color: var(--gold); font-family: var(--mono); }
  .hud-chip .v.warn { color: var(--gold); }
  .hud-chip .v.bad { color: var(--red); }
  .hud-chip .v.good { color: var(--green); }
  .hud-chip.clickable { cursor: pointer; }
  .hud-chip.clickable:hover { border-color: var(--accent); }

  /* ===== Legend (bottom-left) ===== */
  #legend {
    position: absolute; z-index: 15; left: 16px; bottom: 14px;
    display: flex; gap: 14px; padding: 7px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--dim);
  }
  #legend span { display: flex; align-items: center; gap: 5px; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  #legend .idle i { background: var(--green); }
  #legend .working i { background: var(--gold); }
  #legend .error i { background: var(--red); }

  /* ===== Inspector (single contextual panel, opens on click) ===== */
  #inspector {
    position: absolute; z-index: 30; top: 54px; right: 16px; bottom: 14px;
    width: 430px; display: none; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; backdrop-filter: blur(8px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.55);
  }
  #inspector.open { display: flex; }
  #inspector > header {
    position: static; height: auto; padding: 12px 14px; pointer-events: auto;
    background: rgba(68,136,255,0.05); border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  #insp-title { margin: 0; font-size: 15px; color: #eef; }
  #insp-district { font-size: 11px; color: var(--dim); margin-top: 2px; }
  #insp-pills { display: flex; gap: 6px; margin-left: auto; padding-top: 2px; }
  .pill {
    font-size: 9.5px; padding: 3px 8px; border-radius: 10px; text-transform: capitalize;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-secondary);
    white-space: nowrap;
  }
  .pill.idle { color: var(--green); border-color: rgba(76,175,80,0.4); }
  .pill.working { color: var(--gold); border-color: rgba(255,179,0,0.4); }
  .pill.error { color: var(--red); border-color: rgba(229,57,53,0.4); }
  #insp-close {
    background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px;
  }
  #insp-close:hover { background: rgba(255,255,255,0.12); }
  #insp-body { flex: 1; overflow-y: auto; padding: 12px; }
  #insp-kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .kpi {
    flex: 1 1 30%; min-width: 96px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 10px;
  }
  .kpi .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); font-weight: 700; }
  .kpi .v { font-size: 19px; font-weight: 800; margin-top: 2px; font-family: var(--mono); }
  #insp-dash { font-size: 12px; }
  #insp-body details {
    border: 1px solid var(--border); border-radius: 8px; margin-top: 10px;
    background: rgba(255,255,255,0.02);
  }
  #insp-body summary {
    cursor: pointer; padding: 9px 11px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--text-secondary); user-select: none;
  }
  #insp-body summary:hover { color: #fff; }
  #insp-body details[open] summary { border-bottom: 1px solid var(--border); color: #fff; }
  #insp-body details > div { padding: 10px 11px; max-height: 260px; overflow-y: auto; }
  #insp-footer { border-top: 1px solid var(--border); padding: 9px 11px 11px; }
  #insp-cmds { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  #chat-log {
    max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px;
    margin-bottom: 8px;
  }
  #chat-log:empty { display: none; }
</style>

<style type="text/css">
  /* ===== Chat ===== */
  .chat-msg { display: flex; flex-direction: column; gap: 2px; }
  .chat-msg .msg-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); }
  .chat-msg.agent .msg-label { color: #7fa8ff; }
  .chat-msg.error .msg-label { color: #ff7f7f; }
  .chat-msg .msg-text {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.45;
  }
  .chat-msg .msg-text pre { margin: 0; font-family: inherit; font-size: 12px; white-space: pre-wrap; }
  .chat-msg .msg-time { font-size: 10px; color: #46586c; }
  .cmd-btns { display: flex; flex-direction: column; gap: 6px; }
  .cmd-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .cmd-btn {
    font-size: 11px; padding: 5px 9px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
    background: rgba(68,136,255,0.08); color: #bcd3f5;
  }
  .cmd-btn:hover { background: rgba(68,136,255,0.2); }
  .chat-bar { display: flex; gap: 6px; }
  #chat-input { flex: 1; }
  #chat-input {
    background: #0d1726; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 12.5px; outline: none;
  }
  #chat-send {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 12px;
  }
  #chat-send:hover { background: #2a66d0; }

  /* ===== Workspace / Report ===== */
  .stat-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .workspace-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-bottom: 8px;
  }
  .workspace-card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: #a9c4e8; }
  .workspace-card .value { font-size: 20px; font-weight: 600; }
  .value.green { color: #6fdc6f; } .value.yellow { color: #f2c14e; } .value.red { color: #ff7a7a; }
  .hint { font-size: 11.5px; color: var(--dim); }
  .inv-item { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed #16222f; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 9px; text-transform: capitalize; }
  .badge-green { background: rgba(111,220,111,0.15); color: #6fdc6f; }
  .badge-yellow { background: rgba(251,193,78,0.15); color: #fbb14e; }
  .badge-red { background: rgba(255,122,122,0.15); color: #ff7a7a; }
  .report-grid { width: 100%; border-collapse: collapse; font-size: 12px; }
  .report-grid td { border: 1px solid var(--border); padding: 5px 7px; }
  .report-grid td:first-child { color: var(--dim); width: 40%; }
  .event-item { font-size: 11.5px; padding: 4px 0; border-bottom: 1px dashed #16222f; }
  .event-item .ts { color: #46586c; }

  /* ===== 3D labels ===== */
  .building-label-3d {
    color: #fff; font-size: 13px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    letter-spacing: 0.3px; text-transform: uppercase; pointer-events: none;
  }
  .building-label-3d.selected { color: #7fa8ff; }
  .building-name-3d {
    color: #9fb3c9; font-size: 10px; text-transform: lowercase; letter-spacing: 0.5px;
    pointer-events: none;
  }

  /* ===== District / street overlay ===== */
  .district-patch {
    transform: translate(-50%, 0);
    font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 6px;
    color: #9fb3c9; opacity: 0.5; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    font-family: inherit; pointer-events: none; white-space: nowrap;
  }
  .street-sign {
    transform: translate(-50%, 0);
    display: inline-block; padding: 2px 10px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px; background: rgba(7,11,18,0.7); color: #e6eefc;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    text-align: center; white-space: nowrap; pointer-events: none;
  }


  /* dashboard.js component styles */
  .dash { display: flex; flex-direction: column; gap: 8px; }
  .dash-row { display: flex; gap: 8px; }
  .dash-card, .monitor-card {
    flex: 1; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px;
  }
  .dash-card h4 {
    margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); font-weight: 700;
  }
  .dash-table-wrap { overflow-x: auto; }
  .dash-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dash-table th {
    text-align: left; padding: 5px 7px; border-bottom: 1px solid var(--border);
    color: var(--text-muted); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; font-size: 10px;
  }
  .dash-table td { padding: 5px 7px; border-bottom: 1px solid rgba(90,140,220,0.08); white-space: nowrap; }
  .dash-table td.mono { font-family: var(--mono); font-size: 11px; }
  .dash-table tr:hover { background: rgba(90,140,220,0.05); }
  .monitor-card h4 {
    margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); font-weight: 700;
  }
  .monitor-card .value { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .monitor-card .value.green { color: var(--accent-green); }
  .monitor-card .value.red { color: var(--accent-red); }
  .monitor-card .value.yellow { color: var(--accent-gold); }
  .monitor-card .value.gold { color: var(--accent-gold); }
  .monitor-event {
    font-size: 11.5px; padding: 4px 0; border-bottom: 1px dashed rgba(90,140,220,0.1);
  }
  .monitor-event .ts { color: var(--text-muted); font-family: var(--mono); font-size: 10px; }
  .monitor-event .type { color: var(--text-secondary); font-weight: 600; }
  .status-badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .status-badge.idea { background: rgba(90,140,220,0.15); color: #6a9ac0; }
  .status-badge.draft, .status-badge.pending { background: rgba(255,213,79,0.15); color: var(--accent-gold); }
  .status-badge.published, .status-badge.completed, .status-badge.active { background: rgba(0,230,118,0.15); color: var(--accent-green); }
  .status-badge.running { background: rgba(0,212,255,0.12); color: var(--accent-cyan); }
  .status-badge.failed { background: rgba(255,61,113,0.15); color: var(--accent-red); }
  .score-badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 800;
    font-size: 11px; background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,92,252,0.15));
    color: var(--accent-gold); border: 1px solid rgba(255,213,79,0.2);
  }
  .dash-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .dash-btn {
    display: inline-block; padding: 6px 12px; border-radius: 6px; background: #1a3a1a;
    color: #9fef00; text-decoration: none; font-size: 12px; border: 1px solid #3a6a2a;
  }
  .dash-btn.secondary { background: #1a2a3a; color: #8ecbff; border-color: #2a4a6a; }
  .dash-json {
    font-size: 11px; max-height: 240px; overflow: auto; background: rgba(0,0,0,0.25);
    padding: 8px; border-radius: 6px; font-family: var(--mono);
  }
  .trace-line {
    display: flex; gap: 6px; align-items: baseline; padding: 3px 5px;
    border-left: 2px solid #444; border-radius: 2px; margin-bottom: 2px;
  }
  .trace-tag { color: #8ab4f8; white-space: nowrap; font-weight: 600; font-family: var(--mono); font-size: 10.5px; }
  .trace-content { color: var(--text-secondary); flex: 1; word-break: break-word; font-size: 11.5px; }
  .trace-line.t-think { border-color: #8ab4f8; }
  .trace-line.t-ok { border-color: var(--accent-green); }
  .trace-line.t-warn { border-color: var(--accent-gold); }
  .trace-line.t-branch { border-color: var(--accent-purple); }
  .trace-line.t-up { border-color: var(--accent-cyan); }
  .trace-line.t-meta { border-color: #ff7043; }
</style>
</head>

<body>
  <header>
    <h1>Virtual City</h1>
    <nav>
      <a href="/">City</a>
      <a href="/manager">Manager</a>
      <a href="/operator">Operator</a>
    </nav>
    <button id="trigger-meeting">Hold Meeting</button>
    <span id="connection-indicator" class="disconnected">connecting…</span>
  </header>

  <div id="loading-screen">
    <div>Loading city…</div>
    <div style="font-size:11px;color:#46586c;">fetching agent state</div>
  </div>

  <div id="canvas-container"></div>
  <div id="interior-display" style="display:none; position:absolute; z-index:25; top:54px; right:16px; bottom:14px; width:430px; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:auto; backdrop-filter:blur(8px);"></div>
  <button id="enter-building" style="display:none; position:absolute; z-index:25; top:54px; right:16px; padding:8px 14px; background:rgba(0,212,255,0.1); border:1px solid #00d4ff; border-radius:6px; font-size:12px; color:#00d4ff; cursor:pointer;" onclick="if(typeof enterBuilding==='function') enterBuilding(currentBuilding)">Double-click to enter</button>
  <button id="exit-building" style="display:none; position:absolute; z-index:25; top:54px; left:16px; padding:8px 14px; background:rgba(255,122,122,0.1); border:1px solid #ff7a7a; border-radius:6px; font-size:12px; color:#ff7a7a; cursor:pointer;">Exit Building</button>

  <div id="hud">
    <div class="hud-chip"><span class="k">Treasury</span><span class="v money" id="hud-treasury">—</span></div>
    <div class="hud-chip"><span class="k">Working</span><span class="v good" id="hud-working">—</span></div>
    <div class="hud-chip"><span class="k">Idle</span><span class="v" id="hud-idle">—</span></div>
    <div class="hud-chip"><span class="k">Errors</span><span class="v bad" id="hud-error">—</span></div>
    <div class="hud-chip clickable" onclick="location.href='/manager'">
      <span class="k">Escalations</span><span class="v warn" id="hud-esc">—</span>
    </div>
  </div>

  <div id="legend">
    <span class="idle"><i></i> idle</span>
    <span class="working"><i></i> working</span>
    <span class="error"><i></i> error</span>
  </div>

  <aside id="inspector">
    <header>
      <div>
        <h2 id="insp-title">Building</h2>
        <div id="insp-district"></div>
      </div>
      <div id="insp-pills">
        <span class="pill" id="insp-status">—</span>
        <span class="pill" id="insp-autonomy">—</span>
      </div>
      <button id="pause-building" style="font-size:10px;padding:3px 9px;background:rgba(255,179,0,0.15);color:#ffb300;border:1px solid #ffb300;border-radius:6px;cursor:pointer;">Pause</button>
      <button id="insp-close" title="Close (Esc)">✕</button>
    </header>

    <div id="insp-body">
      <div id="insp-kpis"></div>
      <div id="insp-dash"></div>
      <details id="insp-activity">
        <summary>Activity</summary>
        <div id="insp-events"></div>
      </details>
      <details id="insp-reasoning">
        <summary>Reasoning trace</summary>
        <div id="insp-traces"></div>
      </details>
    </div>

    <footer id="insp-footer">
      <div id="chat-log"></div>
      <div id="insp-cmds"></div>
      <div class="chat-bar">
        <input id="chat-input" placeholder="Command this building…" autocomplete="off">
        <button id="chat-send">Send</button>
      </div>
    </footer>
  </aside>

  <script>
// Pause/resume + enter/exit button handlers are wired in city_3d.js
</script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  <script src="https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.umd.js"></script>
  <script type="module" src="{{ url_for('static', filename='city_3d.js') }}"></script>
</body>
</html>
